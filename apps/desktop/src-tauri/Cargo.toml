[package]
name = "app"
default-run = "app"
version = "1.0.0"
description = "Atlas Desktop"
authors = ["Rifaque Ahmed"]
license = "MIT"
repository = "https://github.com/Rifaque/atlas"
edition = "2021"
rust-version = "1.77.2"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.6.0"
tokio = { version = "1", features = ["time", "fs", "sync", "macros", "rt-multi-thread"] }

# Project dependencies
reqwest = { version = "0.12", features = ["json", "stream"] }
ignore = "0.4"                    # .gitignore-aware directory walking
lancedb = "0.15"                  # vector database
arrow-array = "53"
arrow-schema = "53"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-recursion = "1"             # async recursive functions
dirs = "5"                        # cross-platform home directory
regex = "1"                       # pattern matching (greetings etc.)
pdf-extract = "0.10.0"
lru = "0.16.3"
keyring = "3"
notify = "6.1.1"
notify-debouncer-mini = "0.4.1"
git2 = { version = "0.19", default-features = false }
tree-sitter = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
