name: Desktop quality and release

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            pnpm version:check -- --expected "${GITHUB_REF_NAME#v}"
          else
            pnpm version:check
          fi

      - name: Verify third-party notices
        run: pnpm notices:check

      - name: Frontend tests
        run: pnpm --filter desktop test

      - name: Frontend lint
        run: pnpm --filter desktop lint

      - name: Frontend production build
        run: pnpm --filter desktop build

      - name: Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Rust check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: Rust Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests and offline retrieval-unit gate
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-targets

  package-windows:
    name: Package Windows x64
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install protoc on Windows
        uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned NSIS bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Upload CI bundle directory
        uses: actions/upload-artifact@v4
        with:
          name: atlas-windows-${{ github.sha }}
          path: apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: error
